name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  IMAGE_NAME: vikasyadav30/cbplsolarinventory
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run type check
        run: npm run type-check

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # Deploy develop builds to Hostinger VPS in the SAME workflow (so you always see this job)
  deploy-staging:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Write Google Sheets service account key
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 - <<'PY'
          import os
          raw = os.environ.get("GOOGLE_SA_JSON") or ""
          if raw.strip():
              open("google-sheets-service-account.json", "w", encoding="utf-8").write(raw)
              print("Wrote Google Sheets key file")
          else:
              print("GOOGLE_SERVICE_ACCOUNT_JSON empty — skipping key file")
          PY

      - name: Copy Google Sheets key to VPS
        if: hashFiles('google-sheets-service-account.json') != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST || secrets.STAGING_HOST }}
          username: ${{ secrets.HOSTINGER_USER || secrets.STAGING_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || secrets.STAGING_PORT || 22 }}
          source: google-sheets-service-account.json
          target: ${{ secrets.STAGING_DEPLOY_PATH || '/opt/chairbord-api' }}/secrets
          overwrite: true

      - name: Create .env and deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_HOST || secrets.STAGING_HOST }}
          username: ${{ secrets.HOSTINGER_USER || secrets.STAGING_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY || secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || secrets.STAGING_PORT || 22 }}
          script: |
            set -e
            DEPLOY_PATH=${{ secrets.STAGING_DEPLOY_PATH || '/opt/chairbord-api' }}
            IMAGE_SHA=${{ env.IMAGE_NAME }}:develop-${{ github.sha }}
            IMAGE_DEVELOP=${{ env.IMAGE_NAME }}:develop
            IMAGE_LATEST=${{ env.IMAGE_NAME }}:latest
            CONTAINER_NAME="cbpl-solar-inventory-backend-staging"
            APP_PORT=${{ secrets.PORT || '3050' }}

            mkdir -p "$DEPLOY_PATH/secrets"
            chmod 700 "$DEPLOY_PATH/secrets"
            cd "$DEPLOY_PATH"

            cat > .env << EOF
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_SSL=${{ secrets.DB_SSL || 'false' }}
            DB_SSL_REJECT_UNAUTHORIZED=${{ secrets.DB_SSL_REJECT_UNAUTHORIZED || 'true' }}
            PORT=${{ secrets.PORT || '3050' }}
            NODE_ENV=staging
            UPLOAD_DIR=${{ secrets.UPLOAD_DIR || './uploads' }}
            MAX_FILE_SIZE=${{ secrets.MAX_FILE_SIZE || '5242880' }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRE=${{ secrets.JWT_EXPIRE || '7d' }}
            LOKI_HOST_IP=${{ secrets.LOKI_HOST_IP || '' }}
            LOKI_JOB_NAME=${{ secrets.LOKI_JOB_NAME || 'Solar_Inventory' }}
            LOG_LEVEL=${{ secrets.LOG_LEVEL || 'info' }}
            AWS_ACCESS_KEY=${{ secrets.AWS_ACCESS_KEY || '' }}
            AWS_SECRET_KEY=${{ secrets.AWS_SECRET_KEY || '' }}
            AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME || 'cbpl-bajaj-node' }}
            AWS_REGION=${{ secrets.AWS_REGION || 'ap-south-1' }}
            PROD_URL=${{ secrets.STAGING_URL || '' }}
            SMS_URL=${{ secrets.SMS_URL }}
            DLT_SENDER_ID=${{ secrets.DLT_SENDER_ID }}
            DLT_API_KEY=${{ secrets.DLT_API_KEY }}
            DLT_TEMPLATE_ID_2FA_AUTH=${{ secrets.DLT_TEMPLATE_ID_2FA_AUTH }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
            GOOGLE_SHEETS_SPREADSHEET_ID=${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID || '18zqPIpa3fcjRvfNqdm3FPC10bszPIPHbv5F3-TMk0A0' }}
            GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/google-sheets-service-account.json
            CRON_SECRET=${{ secrets.CRON_SECRET }}
            EOF
            chmod 600 .env

            echo "🔎 Env presence:"
            for key in DB_HOST EMAIL_USER EMAIL_PASSWORD AWS_REGION AWS_BUCKET_NAME; do
              if grep -q "^${key}=.\+" .env; then echo "$key=SET"; else echo "$key=EMPTY_OR_MISSING"; fi
            done

            echo "📥 Pulling image..."
            IMAGE_NAME=""
            for candidate in "$IMAGE_SHA" "$IMAGE_DEVELOP" "$IMAGE_LATEST"; do
              if sudo docker pull "$candidate"; then
                IMAGE_NAME="$candidate"
                break
              fi
            done
            if [ -z "$IMAGE_NAME" ]; then
              echo "❌ Failed to pull image"
              exit 1
            fi
            echo "✅ Using $IMAGE_NAME"

            sudo docker stop "$CONTAINER_NAME" || true
            sudo docker rm "$CONTAINER_NAME" || true

            KEY_FILE="$DEPLOY_PATH/secrets/google-sheets-service-account.json"
            VOLUME_ARGS=""
            if [ -s "$KEY_FILE" ]; then
              chmod 600 "$KEY_FILE" || true
              VOLUME_ARGS="-v $KEY_FILE:/app/secrets/google-sheets-service-account.json:ro"
            fi

            sudo docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p "${APP_PORT}:${APP_PORT}" \
              --env-file "$DEPLOY_PATH/.env" \
              $VOLUME_ARGS \
              "$IMAGE_NAME"

            sleep 5
            if ! sudo docker ps | grep -q "$CONTAINER_NAME"; then
              echo "❌ Container failed"
              sudo docker logs "$CONTAINER_NAME" || true
              exit 1
            fi

            sudo docker exec "$CONTAINER_NAME" printenv | grep -E '^EMAIL_' || echo "EMAIL_*=MISSING"
            sudo docker exec "$CONTAINER_NAME" npm run migrate || true
            sudo docker image prune -f || true
            echo "✅ Deployed to Hostinger VPS"

      - name: Health check
        run: |
          sleep 5
          URL="${{ secrets.STAGING_URL }}"
          if [ -z "$URL" ]; then
            echo "STAGING_URL not set — skip health check"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/health" || echo "000")
          echo "Health status: $code"
          [ "$code" = "200" ]

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
