name: Build and Push to Docker Hub

# Manual only — CI already builds/pushes on push to main/develop.
# Keeping this avoids a third duplicate multi-arch build on every main push.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to push (in addition to sha)'
        required: false
        type: string
        default: 'manual'

env:
  IMAGE_NAME: vikasyadav30/cbplsolarinventory

jobs:
  build-and-push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.tag }}
            ${{ env.IMAGE_NAME }}:manual-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
